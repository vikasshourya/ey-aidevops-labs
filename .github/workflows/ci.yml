name: ci

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        working-directory: api
        run: python -m pytest tests

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        working-directory: api
        run: python -m pytest tests

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_TOKEN }}

      - name: Build and push API image
        run: |
          image="$ACR_LOGIN_SERVER/$NAMESPACE/shipwave-api:${{ github.sha }}"
          docker build -t "$image" ./api
          docker push "$image"

      - name: Verify non-root user
        run: |
          image="$ACR_LOGIN_SERVER/$NAMESPACE/shipwave-api:${{ github.sha }}"
          docker run --rm --entrypoint id "$image"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy API chart
        run: |
          helm upgrade --install shipwave-api helm/ -n "$NAMESPACE" \
            --set image.repository="$ACR_LOGIN_SERVER/$NAMESPACE/shipwave-api" \
            --set image.tag="${{ github.sha }}" \
            --wait --timeout 3m

      - name: Wait for API rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/shipwave-api --timeout=180s

      - name: Check pod readiness
        run: kubectl -n "$NAMESPACE" get pods

      - name: Port-forward and verify health
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/shipwave-api 8080:8000 &
          PF=$!
          trap "kill $PF" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          echo "Health endpoint did not return HTTP 200"; exit 1
