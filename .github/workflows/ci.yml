name: ci

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        working-directory: api
        run: python -m pytest tests

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest httpx

      - name: Run tests
        working-directory: api
        run: python -m pytest tests

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USER }}
          password: ${{ secrets.ACR_TOKEN }}

      - name: Build and push API image
        run: |
          image="$ACR_LOGIN_SERVER/$NAMESPACE/shipwave-api:${{ github.sha }}"
          docker build -t "$image" ./api
          docker push "$image"

      - name: Verify non-root user
        run: |
          image="$ACR_LOGIN_SERVER/$NAMESPACE/shipwave-api:${{ github.sha }}"
          docker run --rm --entrypoint id "$image"

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        shell: pwsh
        run: |
          $kubeconfig = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('${{ secrets.KUBECONFIG_B64 }}'))
          $kubeconfigPath = Join-Path $env:RUNNER_TEMP 'kubeconfig'
          Set-Content -Path $kubeconfigPath -Value $kubeconfig -NoNewline
          "KUBECONFIG=$kubeconfigPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deploy API chart
        shell: pwsh
        run: |
          helm upgrade --install shipwave-api ./helm `
            --namespace $env:NAMESPACE `
            `
            --set image.repository=$env:ACR_LOGIN_SERVER/$env:NAMESPACE/shipwave-api `
            --set image.tag=${{ github.sha }} `
            --wait `
            --timeout 3m

      - name: Wait for API rollout
        shell: pwsh
        run: kubectl -n $env:NAMESPACE rollout status deployment/shipwave-api --timeout=180s

      - name: Check pod readiness
        shell: pwsh
        run: kubectl -n $env:NAMESPACE get pods

      - name: Port-forward and verify health
        shell: pwsh
        run: |
          $job = Start-Job -ScriptBlock { kubectl -n $using:NAMESPACE port-forward svc/shipwave-api 8080:8000 }
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -Uri http://127.0.0.1:8080/health -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) {
              throw 'Health endpoint did not return HTTP 200'
            }
          } finally {
            Stop-Job $job -ErrorAction SilentlyContinue | Out-Null
            Receive-Job $job -ErrorAction SilentlyContinue | Out-Null
            Remove-Job $job -ErrorAction SilentlyContinue | Out-Null
          }
