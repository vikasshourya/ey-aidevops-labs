apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickquote
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: quickquote
  template:
    metadata:
      labels:
        app: quickquote
    spec:
      containers:
        - name: quickquote
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}