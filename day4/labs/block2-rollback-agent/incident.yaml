# Apply with: kubectl -n $env:NAMESPACE apply -f incident.yaml
# Then roll it to a broken image to trigger the agent:
#   kubectl -n $env:NAMESPACE set image deploy/agent-demo api=nginx:does-not-exist-999
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-demo
  labels: {app: agent-demo}
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-demo}
  template:
    metadata:
      labels: {app: agent-demo}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits:   {cpu: "100m", memory: "128Mi"}
