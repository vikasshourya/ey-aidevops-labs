apiVersion: v1
kind: Secret
metadata:
  name: shipwave-api
type: Opaque
stringData:
  API_KEY: "{{ .Values.api.apiKey }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipwave-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: shipwave-api
  template:
    metadata:
      labels:
        app: shipwave-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.api.service.targetPort }}
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: shipwave-api
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: shipwave-api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: shipwave-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http